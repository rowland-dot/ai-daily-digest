name: Fetch daily AI sources & render site

on:
  schedule:
    # 20:30 UTC Mon-Fri = 06:30 Sydney AEST (30 min before the Claude routine fires at 07:00)
    - cron: "30 20 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch upstream sources (includes Follow Builders feeds)
        run: node scripts/fetch-sources.mjs

      - name: Compute today's UTC date
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore today's audio cache (if any)
        id: audio-cache
        uses: actions/cache@v4
        with:
          # v12: Article-essence engine — real TLDRs fetched via Jina
          # Reader for Simon Willison, OpenAI lab posts, and Follow
          # Builders blogs. Caches per-URL summaries so unchanged
          # articles are free on subsequent runs.
          path: |
            docs/digest.mp3
            docs/digest-en.mp3
            docs/digest-zh.mp3
            docs/audio-cues.json
            docs/audio-cues-en.json
            docs/audio-cues-zh.json
            docs/content-translations.json
            data/translation-cache.json
            data/article-essence-cache.json
          key: digest-mp3-v12-${{ steps.today.outputs.date }}

      - name: Install ffmpeg (only if regenerating audio)
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install edge-tts + deep-translator (always — translation needs it)
        run: pip install --quiet edge-tts deep-translator

      - name: Generate narration MP3 + refresh translations
        run: |
          mkdir -p docs
          python scripts/generate-audio.py
        continue-on-error: true

      - name: Publish data/ to Pages (for the Claude routine to read)
        run: |
          mkdir -p docs/data
          cp -v data/*.json docs/data/ 2>/dev/null || true
          ls -la docs/data/

      - name: Render static site
        run: node scripts/render-site.mjs

      # Note: deliberately NOT committing data/ or docs/ back to main.
      # The workflow builds them fresh from scripts/ + upstream sources every
      # run and serves them via the Pages artifact below. Keeping them out of
      # git avoids races with local pushes (every code change used to require
      # a rebase against the bot's most recent commit). Local devs can run
      # `node scripts/fetch-sources.mjs && node scripts/render-site.mjs` to
      # preview, but those generated files are gitignored.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
