name: Fetch daily AI sources & render site

on:
  schedule:
    # 20:30 UTC Mon-Fri = 06:30 Sydney AEST (30 min before the Claude routine fires at 07:00)
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch upstream sources
        run: node scripts/fetch-sources.mjs

      - name: Fetch Follow Builders feeds
        run: |
          mkdir -p data
          for feed in feed-x feed-podcasts feed-blogs; do
            url="https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/${feed}.json"
            outfile="data/follow-builders-${feed#feed-}.json"
            if curl -fsSL "$url" -o "$outfile"; then
              echo "[ok] $feed -> $outfile"
            else
              echo "[warn] failed to fetch $url"
            fi
          done

      - name: Render static site
        run: node scripts/render-site.mjs

      # Note: deliberately NOT committing data/ or docs/ back to main.
      # The workflow builds them fresh from scripts/ + upstream sources every
      # run and serves them via the Pages artifact below. Keeping them out of
      # git avoids races with local pushes (every code change used to require
      # a rebase against the bot's most recent commit). Local devs can run
      # `node scripts/fetch-sources.mjs && node scripts/render-site.mjs` to
      # preview, but those generated files are gitignored.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
