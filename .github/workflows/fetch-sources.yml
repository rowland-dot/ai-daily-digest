name: Fetch daily AI sources & render site

on:
  schedule:
    # 20:30 UTC daily = 06:30 Sydney AEST (30 min before the Claude routine fires at 07:00)
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write   # push data/*.json to `data` branch for routine access
  pages: write
  id-token: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The translation / essence caches grow over time and benefit from
      # being preserved across runs regardless of which articles surface
      # today. Restore the most recent one BEFORE fetching so fetch can
      # reuse already-summarised URLs.
      - name: Restore helpers cache (translation + essence)
        uses: actions/cache@v4
        with:
          path: |
            data/translation-cache.json
            data/article-essence-cache.json
          key: helpers-${{ github.run_id }}
          restore-keys: |
            helpers-

      - name: Fetch upstream sources (includes Follow Builders feeds)
        run: node scripts/fetch-sources.mjs

      - name: Compute today's UTC date
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Hash data/*.json content (excluding helper caches and volatile
      # `fetched_at` timestamps) so the audio cache key reflects the
      # actual article set. When the data hash matches a previous run,
      # the cached audio is valid for THIS data — page + audio stay in
      # lockstep. When data changes (e.g. AIHOT publishes a new post
      # mid-day), the cache misses and audio regenerates against the
      # fresh data. This fixes the "audio cue points at the wrong card
      # after a new article appears" misalignment.
      - name: Hash fetched data (audio cache invalidator)
        id: data-hash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const ignore = new Set(["translation-cache.json", "article-essence-cache.json"]);
            const files = fs.readdirSync("data").filter(f => f.endsWith(".json") && !ignore.has(f)).sort();
            const h = crypto.createHash("sha256");
            for (const f of files) {
              const raw = fs.readFileSync(path.join("data", f), "utf8");
              const obj = JSON.parse(raw);
              // Strip volatile fields that change every run but do not
              // affect the audio (timestamps, per-source elapsed-ms).
              if (obj && typeof obj === "object") {
                delete obj.fetched_at;
                delete obj.date_utc;
                if (obj.sources) for (const k of Object.keys(obj.sources)) { delete obj.sources[k].ms; }
              }
              h.update(f + ":" + JSON.stringify(obj) + "\n");
            }
            process.stdout.write(h.digest("hex").slice(0, 16));
          ' > .data-hash.tmp
          DATA_HASH=$(cat .data-hash.tmp)
          rm -f .data-hash.tmp
          echo "hash=$DATA_HASH" >> $GITHUB_OUTPUT
          echo "Data hash: $DATA_HASH"

      - name: Restore audio cache (keyed on data content)
        id: audio-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/digest.mp3
            docs/digest-en.mp3
            docs/digest-zh.mp3
            docs/audio-cues.json
            docs/audio-cues-en.json
            docs/audio-cues-zh.json
            docs/content-translations.json
          key: audio-v15-${{ steps.data-hash.outputs.hash }}

      - name: Install ffmpeg (only if regenerating audio)
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install edge-tts + deep-translator (always — translation needs it)
        run: pip install --quiet edge-tts deep-translator

      - name: Generate narration MP3 + refresh translations
        run: |
          mkdir -p docs
          python scripts/generate-audio.py
        continue-on-error: true

      - name: Publish data/ to Pages (for human-readable browser view)
        run: |
          mkdir -p docs/data
          cp -v data/*.json docs/data/ 2>/dev/null || true
          ls -la docs/data/

      # The Claude Code routine sandbox host allowlist blocks
      # *.github.io but allows raw.githubusercontent.com. So we also
      # publish today's snapshot to a dedicated `data` branch — the
      # routine reads from
      # https://raw.githubusercontent.com/rowland-dot/ai-daily-digest/data/<file>.json
      # The `data` branch is bot-only; local devs push to `main` and
      # the two branches never touch, so there's no race.
      - name: Publish data snapshot to `data` branch (routine reads from raw.githubusercontent.com)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the snapshot into a temp worktree on the `data` branch.
          WT=$(mktemp -d)
          # Create the orphan branch on first run; otherwise check it out.
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git worktree add "$WT" data
          else
            git worktree add --detach "$WT"
            (cd "$WT" && git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true)
          fi
          # Replace branch contents with today's data files only.
          rm -f "$WT"/*.json 2>/dev/null || true
          cp -v data/*.json "$WT"/
          (cd "$WT" && git add -A && \
            git diff --cached --quiet || \
            git commit -m "data snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          (cd "$WT" && git push origin HEAD:data)
          git worktree remove "$WT" --force

      - name: Render static site
        run: node scripts/render-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
