name: Fetch daily AI sources

on:
  schedule:
    # 20:30 UTC Mon-Fri = 06:30 Sydney AEST (30 min before the Claude routine fires at 07:00)
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch sources
        run: node scripts/fetch-sources.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "data: refresh sources $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
