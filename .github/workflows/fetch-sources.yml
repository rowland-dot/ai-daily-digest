name: Fetch daily AI sources & render site

on:
  schedule:
    # 20:30 UTC daily = 06:30 Sydney AEST (30 min before the Claude routine fires at 07:00)
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write   # push data/*.json to `data` branch for routine access
  pages: write
  id-token: write

# Latest push wins. If a previous build is mid-audio-regen and you push
# again, the older build is cancelled so the new commit reaches users
# fast instead of queueing behind a 12-min audio job.
concurrency:
  group: fetch-sources
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD~1 needed for diff-based mode detection

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------- Pipeline mode detection ----------
      # Decides whether this build needs the slow path (fetch upstream
      # feeds + regenerate audio) or can use cached state and just
      # re-render. Code-only pushes get the fast path. Anything that
      # touches the data fetch / audio script — and the daily cron —
      # gets the full path.
      - name: Decide pipeline mode
        id: mode
        run: |
          ev="${{ github.event_name }}"
          if [ "$ev" = "schedule" ] || [ "$ev" = "workflow_dispatch" ]; then
            mode=full; reason="event=$ev"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | \
               grep -qE '^scripts/fetch-sources\.mjs|^scripts/generate-audio\.py|^\.github/workflows/'; then
            mode=full; reason="touched fetch/audio/workflow file"
          else
            mode=fast; reason="code-only push"
          fi
          echo "value=$mode" >> $GITHUB_OUTPUT
          echo "Pipeline mode: $mode ($reason)"

      # ---------- Pipeline state cache (data + audio + cues) ----------
      # In fast mode this restores the last full run's data/*.json,
      # MP3s, and cue files so render can run immediately. In full
      # mode it still restores translation-cache.json etc. for reuse.
      - name: Restore pipeline state
        id: state-cache
        uses: actions/cache@v4
        with:
          path: |
            data/aihot-daily.json
            data/aihot-ai-models.json
            data/aihot-ai-products.json
            data/aihot-industry.json
            data/aihot-paper.json
            data/openai-blog.json
            data/simon-willison.json
            data/github-trending.json
            data/hf-popular.json
            data/follow-builders-x.json
            data/follow-builders-podcasts.json
            data/follow-builders-blogs.json
            data/localllama.json
            data/manifest.json
            data/translation-cache.json
            data/article-essence-cache.json
            docs/digest.mp3
            docs/digest-en.mp3
            docs/digest-zh.mp3
            docs/audio-cues.json
            docs/audio-cues-en.json
            docs/audio-cues-zh.json
            docs/content-translations.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      # If we wanted fast mode but cached state is missing (cold cache,
      # first run after key bump, etc.) force full mode so the build
      # still produces a valid page.
      - name: Fallback to full mode if cache empty
        id: mode-final
        run: |
          want="${{ steps.mode.outputs.value }}"
          if [ "$want" = "fast" ] && [ ! -f data/manifest.json -o ! -f docs/digest.mp3 ]; then
            echo "Cached state missing — falling back to full mode"
            echo "value=full" >> $GITHUB_OUTPUT
          else
            echo "value=$want" >> $GITHUB_OUTPUT
          fi
          echo "Final mode: $(cat $GITHUB_OUTPUT | grep ^value= | tail -1)"

      # ---------- Full-mode steps (fetch + audio) ----------

      - name: Fetch upstream sources
        if: steps.mode-final.outputs.value == 'full'
        run: node scripts/fetch-sources.mjs

      - name: Compute today's UTC date
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Hash data/*.json content (excluding helper caches and volatile
      # `fetched_at` timestamps) so the audio cache key reflects the
      # actual article set. Same data → same hash → audio cache hit.
      - name: Hash fetched data (audio cache invalidator)
        if: steps.mode-final.outputs.value == 'full'
        id: data-hash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const ignore = new Set(["translation-cache.json", "article-essence-cache.json"]);
            const files = fs.readdirSync("data").filter(f => f.endsWith(".json") && !ignore.has(f)).sort();
            const h = crypto.createHash("sha256");
            for (const f of files) {
              const raw = fs.readFileSync(path.join("data", f), "utf8");
              const obj = JSON.parse(raw);
              if (obj && typeof obj === "object") {
                delete obj.fetched_at;
                delete obj.date_utc;
                if (obj.sources) for (const k of Object.keys(obj.sources)) { delete obj.sources[k].ms; }
              }
              h.update(f + ":" + JSON.stringify(obj) + "\n");
            }
            process.stdout.write(h.digest("hex").slice(0, 16));
          ' > .data-hash.tmp
          DATA_HASH=$(cat .data-hash.tmp)
          rm -f .data-hash.tmp
          echo "hash=$DATA_HASH" >> $GITHUB_OUTPUT
          echo "Data hash: $DATA_HASH"

      - name: Restore audio cache (keyed on data content)
        if: steps.mode-final.outputs.value == 'full'
        id: audio-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/digest.mp3
            docs/digest-en.mp3
            docs/digest-zh.mp3
            docs/audio-cues.json
            docs/audio-cues-en.json
            docs/audio-cues-zh.json
            docs/content-translations.json
          key: audio-v16-${{ steps.data-hash.outputs.hash }}

      - name: Install ffmpeg (only if regenerating audio)
        if: steps.mode-final.outputs.value == 'full' && steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install edge-tts + deep-translator
        if: steps.mode-final.outputs.value == 'full'
        run: pip install --quiet edge-tts deep-translator

      - name: Generate narration MP3 + refresh translations
        if: steps.mode-final.outputs.value == 'full'
        run: |
          mkdir -p docs
          python scripts/generate-audio.py
        continue-on-error: true

      # ---------- Always: publish data + render + deploy ----------

      - name: Publish data/ to Pages (human-readable browser view)
        run: |
          mkdir -p docs/data
          cp -v data/*.json docs/data/ 2>/dev/null || true
          ls -la docs/data/

      # `data` branch publish only runs in full mode — fast-mode data
      # is unchanged from the prior full run, so no new snapshot needed.
      - name: Publish data snapshot to `data` branch
        if: steps.mode-final.outputs.value == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT=$(mktemp -d)
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git worktree add "$WT" data
          else
            git worktree add --detach "$WT"
            (cd "$WT" && git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true)
          fi
          rm -f "$WT"/*.json 2>/dev/null || true
          cp -v data/*.json "$WT"/
          (cd "$WT" && git add -A && \
            git diff --cached --quiet || \
            git commit -m "data snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          (cd "$WT" && git push origin HEAD:data)
          git worktree remove "$WT" --force

      - name: Render static site
        run: node scripts/render-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
