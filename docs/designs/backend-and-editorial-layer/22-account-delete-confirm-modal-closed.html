<!DOCTYPE html>
<html lang="en" data-theme="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — account-delete-confirm-modal-closed</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!--
| State slug                                 | Tier | Entry-point | What it shows |
|--------------------------------------------|------|-------------|---------------|
| account-delete-confirm-modal-closed        | A    | none        | /account page with the delete modal NOT open (entry-point baseline for the modal pair). Identical to account-linked-active but explicitly named for parity coverage of the modal's two visual states. |
-->
<section class="screen"
         data-mockup-state="account-delete-confirm-modal-closed"
         data-mockup-tier="A"
         data-mockup-entry-point="none"
         data-mockup-capture="[data-testid='account-page']"
         data-mockup-trigger='[]'>

  <header class="hero">
    <div class="lang-switch" role="tablist" aria-label="Audio language">
      <button data-lang="en" role="tab" aria-pressed="true">EN</button>
      <button data-lang="zh" role="tab" aria-pressed="false">中文</button>
    </div>
    <div class="theme-switch" role="tablist" aria-label="Theme">
      <button data-theme="linear" role="tab" aria-pressed="false">Linear</button>
      <button data-theme="claude" role="tab" aria-pressed="true">Claude</button>
    </div>
    <h1>Account</h1>
    <p class="date">Manage your subscription and saved articles</p>
  </header>

  <main class="container" data-testid="account-page" data-auth="linked" data-newsletter-state="subscribed">
    <div class="account-card">
      <h3>Your subscription</h3>
      <p class="muted">Signed in as <strong>alex@example.com</strong></p>
      <div class="account-row">
        <span class="row-label">Newsletter</span>
        <span class="row-value">Subscribed · daily email at 07:00 Sydney</span>
        <button type="button" class="btn-secondary">Unsubscribe</button>
      </div>
      <div class="account-row">
        <span class="row-label">Language preference</span>
        <div class="lang-pref" role="tablist" aria-label="Email language" data-testid="lang-pref">
          <button type="button" role="tab" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" role="tab" data-lang="zh" aria-pressed="false">中文</button>
        </div>
      </div>
    </div>

    <div class="account-card">
      <h3>Danger zone</h3>
      <p class="muted">Delete everything we know about you. This can't be undone.</p>
      <div class="account-row" style="border-top: 0; justify-content: flex-start;">
        <button type="button" class="btn-danger" data-testid="delete-data-btn">Delete my data</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>Snapshot fetched 2026-05-17 · <a href="#">source on GitHub</a></div>
  </footer>

</section>
</body>
</html>
